<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>요금표 관리</title>
    <link rel="stylesheet" href="pricing.css" />
  </head>
  <body>
    <main class="editor">
      <header class="editor__header">
        <div>
          <p class="editor__brand">월드스키 카운터</p>
          <h1>요금표 관리</h1>
          <p class="editor__subtitle">
            각 요금 항목을 수정하고 JSON 파일로 내보내거나 붙여넣어 업데이트할 수 있습니다.
          </p>
        </div>
        <div class="editor__actions">
          <div class="primary-actions">
            <button id="save-btn" type="button">서버에 저장</button>
            <label class="file-input">
              <input type="file" id="import-file" accept="application/json" hidden />
              <span>JSON 불러오기</span>
            </label>
            <button id="export-btn" type="button">JSON 내보내기</button>
          </div>
          <div class="link-btn-group">
            <a class="link-btn" href="index.html">계산기로 돌아가기</a>
            <a class="link-btn" href="faq.html">자주하는 질문</a>
          </div>
        </div>
      </header>

      <section class="season-tabs" role="tablist">
        <button class="season-tab active" data-season="offSeason" role="tab">비수기</button>
        <button class="season-tab" data-season="peakSeason" role="tab">성수기</button>
      </section>

      <section class="editor__body">
        <aside class="category-list">
          <div class="category-actions">
            <input id="new-category-name" type="text" placeholder="새 카테고리명" />
            <button id="add-category-btn" type="button">카테고리 추가</button>
          </div>
          <div id="category-list"></div>
        </aside>
        <section class="category-editor">
          <div class="category-editor__header">
            <h2 id="category-title">카테고리를 선택하세요</h2>
            <div class="category-editor__actions">
              <button id="add-item-btn" type="button">항목 추가</button>
            </div>
          </div>
          <div id="period-tabs" class="period-tabs" hidden></div>
          <div class="group-tabs-container">
            <div id="group-tabs" class="group-tabs" hidden></div>
            <div id="group-actions" class="group-actions" hidden>
              <input id="new-group-name" type="text" placeholder="새 하위 탭 이름" />
              <button id="add-group-btn" type="button">하위 탭 추가</button>
            </div>
          </div>
          <div id="item-table" class="item-table"></div>
        </section>
      </section>

      <section class="holiday-panel">
        <div class="holiday-header">
          <div>
            <h2>공휴일 관리</h2>
            <p class="hint">공휴일은 자동으로 주말 요금으로 적용됩니다.</p>
          </div>
          <button type="button" id="holiday-toggle-btn" class="holiday-toggle-btn" aria-label="공휴일 관리 접기/펼치기">목록 펼치기</button>
        </div>
        <div class="holiday-content" id="holiday-content">
          <div class="holiday-form">
            <input type="date" id="holiday-date" />
            <input type="text" id="holiday-label" placeholder="공휴일 이름" />
            <button type="button" id="add-holiday-btn">추가</button>
          </div>
          <ul id="holiday-list" class="holiday-list"></ul>
        </div>
      </section>

      <section class="editor__footer">
        <div>
          <p class="hint">수정 내용은 자동 저장되지 않습니다. 저장 버튼을 눌러 서버에 반영하세요.</p>
          <p class="hint">JSON 내보내기/불러오기로 백업 및 복원이 가능합니다.</p>
          <p class="hint" id="save-status"></p>
        </div>
        <button id="copy-json-btn" type="button">클립보드에 JSON 복사</button>
      </section>
    </main>

    <script src="pricing.js"></script>
    <script src="holidays.js"></script>
    <script src="pricing-editor.js"></script>
    <script>
      // pricing.js가 로드되면 window.pricingData가 설정됨
      // pricing-editor.js에서 이 값을 사용할 수 있도록 함
    </script>
  </body>
</html>
