<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>자주하는 질문</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="faq.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div class="header-main">
          <p class="app__brand">월드스키 카운터</p>
          <h1>자주하는 질문</h1>
          <p class="app__subtitle">
            고객 상담 시 자주 묻는 질문과 답변을 확인할 수 있습니다.
          </p>
        </div>
        <div class="header-right">
          <div class="header-actions">
            <div class="link-btn-group">
              <a class="link-btn" href="index.html" aria-label="현장 상담 계산기로 이동">현장 상담</a>
              <a class="link-btn" href="phone.html" aria-label="전화 상담 계산기로 이동">전화 상담</a>
              <a class="link-btn" href="pricing.html" aria-label="요금표 관리 페이지로 이동">요금표 관리</a>
            </div>
            <button id="edit-mode-btn" class="edit-mode-btn" type="button">편집 모드</button>
          </div>
        </div>
      </header>

      <section class="faq-container">
        <div class="faq-search-container">
          <input type="text" id="faq-search-input" class="faq-search-input" placeholder="질문이나 답변에서 키워드를 검색하세요..." />
          <button type="button" id="faq-search-clear" class="faq-search-clear" hidden>✕</button>
        </div>
        <div class="faq-actions" id="faq-actions" hidden>
          <button id="add-faq-btn" type="button" class="add-faq-btn">질문 추가하기</button>
          <button id="save-faq-btn" type="button" class="save-faq-btn-main" disabled>변경사항 저장</button>
          <span id="faq-save-status" class="faq-save-status"></span>
        </div>
        <div class="faq-category-filter" id="faq-category-filter">
          <button type="button" class="faq-category-btn active" data-category="all">전체</button>
          <button type="button" class="faq-category-btn" data-category="영업문의">영업문의</button>
          <button type="button" class="faq-category-btn" data-category="패키지문의">패키지문의</button>
          <button type="button" class="faq-category-btn" data-category="교통문의">교통문의</button>
          <button type="button" class="faq-category-btn" data-category="펜션문의">펜션문의</button>
          <button type="button" class="faq-category-btn" data-category="강습문의">강습문의</button>
          <button type="button" class="faq-category-btn" data-category="미분류">미분류</button>
        </div>
        <div id="faq-list" class="faq-list"></div>
        <div id="faq-empty" class="faq-empty" hidden>
          <p>등록된 질문이 없습니다.</p>
          <p class="faq-empty-hint">편집 모드를 활성화하여 질문을 추가하세요.</p>
        </div>
      </section>
    </main>

    <script src="faq.js"></script>
    <script src="faq-editor.js"></script>
  </body>
</html>
